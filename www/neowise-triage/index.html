<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    let latest = 0;
    let pending;
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = ++latest;
      pending?.abort();
      const controller = new AbortController();
      pending = controller;
      result.textContent = "";
      const text = document.querySelector("#message").value;
      if (!text.trim()) {
        result.textContent = "Введите текст заявки.";
        return;
      }
      result.textContent = "Разбираем заявку...";
      const timer = setTimeout(() => controller.abort(), 3000);
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        const data = await reply.json();
        if (id !== latest) return;
        if (reply.status === 400 && data?.status === "invalid_input") {
          result.textContent = "Введите текст заявки.";
        } else if (reply.ok && data?.status === "ready" &&
                   Object.hasOwn(topics, data.topic) &&
                   typeof data.draft === "string" && data.draft.trim()) {
          result.textContent = `Тема: ${topics[data.topic]}\n\nЧерновик ответа:\n${data.draft}`;
        } else {
          throw new Error("Manual review required");
        }
      } catch {
        if (id === latest) {
          result.textContent = "Не удалось разобрать заявку автоматически. Разберите ее вручную и подготовьте ответ клиенту.";
        }
      } finally {
        clearTimeout(timer);
      }
    });
  </script>
</body>
</html>
